[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tripwire"
version = "0.1.0"
description = "Static malware triage for newly published PyPI and npm releases"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Rayano Smith" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "defusedxml>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
tripwire = "tripwire.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tripwire = ["data/*.txt", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # third-party: starlette asks for "httpx2" in its own test client
    "ignore:Using `httpx` with `starlette.testclient`",
]
